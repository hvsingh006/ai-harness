name: Apply simplified AI Harness build

on:
  push:
    branches: [main]
    paths:
      - '.aih-sync/ready'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staged payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply staged source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .aih-sync/payload.tar.gz -C .
          if [ -f .aih-delete ]; then
            while IFS= read -r path; do
              [ -z "$path" ] || rm -f -- "$path"
            done < .aih-delete
            rm -f .aih-delete
          fi
          rm -rf .aih-sync
      - name: Validate simplified build
        run: npm test
      - name: Commit simplified build
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-simplify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'simplify project spaces around ChatGPT and Gemini'
          git push origin HEAD:main
