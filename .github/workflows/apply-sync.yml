name: Apply AI Harness sync

on:
  push:
    branches: [main]
    paths:
      - '.aih-sync/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout staged payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          cat .aih-sync/chunk-* > /tmp/aih-sync.b64
          base64 --decode /tmp/aih-sync.b64 > /tmp/aih-sync.tar.gz
          tar -xzf /tmp/aih-sync.tar.gz -C .
          rm -rf .aih-sync
      - name: Validate 0.6 source
        shell: bash
        run: |
          set -euo pipefail
          npm test
          HARNESS_WORKSPACE_ROOT="$RUNNER_TEMP/ai-harness-workspace" npm run doctor
      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'separate app updates from persistent workspace'
          git push origin HEAD:main
