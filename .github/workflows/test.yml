name: Test AI Harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show versions
        run: |
          node --version
          npm --version
      - name: Run tests
        run: npm test
      - name: Run diagnostics
        run: npm run doctor
